name: Release FoundryVTT Module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # Required for uploading release assets
  actions: write    # Required for interacting with releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js (for modifying module.json and running npm scripts)
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install

      - name: Modify module.json with version
        run: |
          VERSION="${GITHUB_REF/refs\/tags\/v/}"
          echo "Updating module.json with version $VERSION"
          jq --arg version "$VERSION" '.version = $version' module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Create zip package
        run: |
          VERSION="${GITHUB_REF/refs\/tags\/v/}"
          mkdir -p release
          zip -r "release/swn-importer-${VERSION}.zip" * -x "*.git*" "*.github*" "release/*" "node_modules/*" "foundry/*"

      - name: Upload release zip to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Modify module.json download field
        run: |
          VERSION="${GITHUB_REF/refs\/tags\/v/}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/swn-importer-${VERSION}.zip"
          echo "Updating download URL in module.json to $DOWNLOAD_URL"
          jq --arg download_url "$DOWNLOAD_URL" '.download = $download_url' module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Upload module.json to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: module.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        run: |
          rm -rf release
